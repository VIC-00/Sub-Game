<html>
<head>

  <title>The Deep-Sea Echo</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Procedural Deep-Sea Audio Synthesizer via Web Audio API
    window.deepSeaAudio = {
      ctx: null,
      init: function() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playPing: function(isLoud) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        // Dual oscillator for rich sonar resonance
        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();

        const freq = isLoud ? 780 : 1320;
        const duration = isLoud ? 2.2 : 1.1;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.75, now + duration);

        gain.gain.setValueAtTime(isLoud ? 0.38 : 0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(freq * 1.5, now);
        osc2.frequency.exponentialRampToValueAtTime(freq * 0.9, now + duration * 0.6);

        gain2.gain.setValueAtTime(isLoud ? 0.15 : 0.08, now);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.6);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc2.connect(gain2);
        gain2.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + duration);
        osc2.start(now);
        osc2.stop(now + duration * 0.6);
      },
      playHeartbeat: function() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // Lub-dub dual low thump
        [0.0, 0.14].forEach((offset, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = now + offset;

          osc.type = 'sine';
          osc.frequency.setValueAtTime(idx === 0 ? 58 : 46, t);
          osc.frequency.exponentialRampToValueAtTime(28, t + 0.15);

          gain.gain.setValueAtTime(idx === 0 ? 0.35 : 0.28, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(t);
          osc.stop(t + 0.16);
        });
      },
      playMonsterRoar: function() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(42, now);
        osc.frequency.linearRampToValueAtTime(85, now + 0.9);
        osc.frequency.linearRampToValueAtTime(32, now + 2.0);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.28, now + 0.6);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 2.0);
      },
      playRelic: function() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [1046.5, 1318.5, 1567.98].forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const start = now + idx * 0.12;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, start);

          gain.gain.setValueAtTime(0.15, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.5);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(start);
          osc.stop(start + 0.5);
        });
      },
      playImpact: function() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.35);
      },
      playDecoy: function() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(1600, now + 0.4);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.5);
      }
    };
  </script>
</head>

</html>
